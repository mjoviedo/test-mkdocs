    - Cap 1 | Computación y redes:
      - 1. La computadora moderna: modulo1/capitulo1/m1c1l1.md
      - 2. Información: modulo1/capitulo1/m1c1l2.md
      - 3. Hardware: modulo1/capitulo1/m1c1l3.md
      - 4. Software: modulo1/capitulo1/m1c1l4.md
      - 5. Internet: modulo1/capitulo1/m1c1l5.md
      - 6. Plataformas: modulo1/capitulo1/m1c1l6.md
      - 7. Datos: modulo1/capitulo1/m1c1l7.md

    - Cap 2 | Inteligencia Artificial:
      - 1. Nuevo paradigma de la computación: modulo1/capitulo2/m1c2l1.md
      - 2. Principales enfoques: modulo1/capitulo2/m1c2l2.md
      - 3. Introducción a modelos de ML: modulo1/capitulo2/m1c2l3.md
      - 4. Principales modelos: modulo1/capitulo2/m1c2l4.md
      - 5. La neurona y la red: modulo1/capitulo2/m1c2l5.md
      - 6. Jugando con redes: modulo1/capitulo2/m1c2l6.md
      - 7. Sesgo y sobreajuste: modulo1/capitulo2/m1c2l7.md

    - Cap 3 | IA Generativa:
      - 1. Introducción al PLN: modulo1/capitulo3/m1c3l1.md
      - 2. Embeddings: modulo1/capitulo3/m1c3l2.md
      - 3. Modelos de lenguaje: modulo1/capitulo3/m1c3l3.md

    - Cap 4 | Infraestructura:
      - 1. Stack: modulo1/capitulo4/m1c4l1.md
      - 2. MCPs: modulo1/capitulo4/m1c4l2.md
      - 3. APIs: modulo1/capitulo4/m1c4l3.md

  - Modulo 2:
    - Presentación: modulo2/m2-intro.md
    - Cap 1 | Conocimiento:
      - 1. El concepto de inteligencia y sus críticas: modulo2/capitulo1/m2c1l1.md
      - 2. Estadística y modelos : modulo2/capitulo1/m2c1l2.md
      - 3. Cognición computarizada: modulo2/capitulo1/m2c1l3.md
      - 4. Delegación de funciones: modulo2/capitulo1/m2c1l4.md

    - Cap 2 | Materia:
      - 1. Minerales, hardware y energía: modulo2/capitulo2/m2c2l1.md
      - 2. Software, Datos y Redes: modulo2/capitulo2/m2c2l2.md
      - 3. Almacenamiento, circulación y propiedad: modulo2/capitulo2/m2c2l3.md
      - 4. Costos ambientales: modulo2/capitulo2/m2c2l4.md
      - 5. Ciclo de vida: modulo2/capitulo2/m2c2l5.md

    - Cap 3 | Trabajo:
      - 1. Trabajo y cambio tecnológico: modulo2/capitulo3/m2c3l1.md
      - 2. Automatización: modulo2/capitulo3/m2c3l2.md
      - 3. Trabajo oculto. Fauxtomatización: modulo2/capitulo3/m2c3l3.md
      - 4. Cognitariado: modulo2/capitulo3/m2c3l4.md
      - 5. Diseño de sistemas sociotécnicos: modulo2/capitulo3/m2c3l5.md

    - Cap 4 | Cultura:

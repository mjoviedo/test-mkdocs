      - 2. Autoría y propiedad intelectual: modulo2/capitulo4/m2c4l2.md
      - 3. La metáfora del espejo: modulo2/capitulo4/m2c4l3.md
      - 4. Problemas emergentes. Psicosis inducida por IA: modulo2/capitulo4/m2c4l4.md
      - 5. Slop: modulo2/capitulo4/m2c4l5.md
      - 6. Imaginarios futuros. Marte y las tecnologías entrañables: modulo2/capitulo4/m2c4l6.md

    - Cap 5 | Ética:
      - 1. Privacidad, dividualidad y perfilado: modulo2/capitulo5/m2c5l1.md
      - 2. Capitalismo de vigilancia: modulo2/capitulo5/m2c5l2.md
      - 3. Democracia, Infocracia, Hipnocracia: modulo2/capitulo5/m2c5l3.md

    - Cap 6 | Política:
      - 1. Poder y estado: modulo2/capitulo6/m2c6l1.md
      - 2. La metáfora del castillo: modulo2/capitulo6/m2c6l2.md
      - 3. Nuevos conflictos geopolíticos: modulo2/capitulo6/m2c6l3.md
      - 4. Gobernanza y marcos regulatorios: modulo2/capitulo6/m2c6l4.md
      - 5. Mirada desde Latam. Desarrollo y dependencia tecnológica: modulo2/capitulo6/m2c6l5.md
    
  - Modulo 3:
    - Presentación: modulo3/m3-intro.md
  - Modulo 4:
    - Presentación: modulo4/m4-intro.md
  

plugins:
  - search:
      lang: es
  - git-committers:
      repository: squidfunk/mkdocs-material
      branch: main
      enabled: !ENV [CI, false]
  - markmap:
  - mark-as-read:
      texts:
        mark_as_read: "Marcar como completada  :white_check_mark:"
        mark_as_unread: "Desmarcar :material-restore:"
        read_tooltip: Completado
        updated_tooltip: El contenido ha sido actualizado
        updated_icon: fontawesome-solid-circle-exclamation
      include:
        - /
  - mkdocs_quiz:
      enabled_by_default: true        # Enable quizzes by default on all pages
      auto_number: false              # Auto-number questions (Question 1:, Question 2:, etc.)
      show_correct: true              # Show correct answers when user gets it wrong
      auto_submit: true               # Auto-submit single-choice quizzes on selection
      disable_after_submit: true      # Disable question after first submission
      shuffle_answers: false          # Randomize the order of answers
      show_progress: true             # Show progress tracker sidebar and mobile bar
      progress_sidebar_position: top  # Position of progress tracker: "top" or "bottom"
      confetti: true                  # Show confetti animation when all quizzes completed
      embed_source: true              # Embed quiz source in HTML for CLI URL fetching
      language: es                    # Default language for quiz UI
      language_patterns: []           # Auto-detect language based on file paths
      custom_translations: {}         # Custom translation files
      cli_run: {}                     # CLI runner menu configuration
  


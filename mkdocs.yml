site_name: IA en Educación Superior
site_url: https://sitename.example
repo_url: https://github.com/mjoviedo/test-mkdocs
repo_name: mjoviedo/test-mkdocs
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  language: es
  icon:
    logo: fontawesome/solid/hexagon-nodes
    edit: fontawesome/solid/pen-to-square
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
#    - navigation.sections
    - content.action.edit
    
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/brightness-2
        name: Modo oscuro
      primary: pink
      accent: teal

    # Light Mode
    - scheme: default
      toggle:
        icon: material/brightness-6
        name: Modo claro
      primary: teal
      accent: pink
    
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
       custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
      title: 
      toc_depth: 3

nav:
  - Inicio: index.md
  - Presentación:
    - Sobre el curso: empecemos/intro.md
    - Recomendaciones: empecemos/recomendaciones.md
    - Comunidad: empecemos/comunidad.md
    - Contribuir: empecemos/contribuir.md
    - Antecedentes: empecemos/antecedentes.md
    - Créditos: empecemos/creditos.md
  - Módulo 1:
    - Presentación: modulo1/m1-intro.md
    - Cap 1 | Nivelación:
      - 1. La computadora: modulo1/capitulo1/m1c1l1.md
      - 2. Información: modulo1/capitulo1/m1c1l2.md
      - 3. Hardware: modulo1/capitulo1/m1c1l3.md
      - 4. Software: modulo1/capitulo1/m1c1l4.md
      - 5. Internet: modulo1/capitulo1/m1c1l5.md
      - 6. Plataformas: modulo1/capitulo1/m1c1l6.md
      - 7. Datos: modulo1/capitulo1/m1c1l7.md
    - Cap 2 | Introducción a la IA:
      - 1. Nuevo paradigma de la computación: modulo1/capitulo2/m1c2l1.md
      - 2. Tipos de machine learning: modulo1/capitulo2/m1c2l2.md
      - 3. Algoritmos principales: modulo1/capitulo2/m1c2l3.md
      - 4. Introducción a las redes neuronales: modulo1/capitulo2/m1c2l1.md
      - 2. Entrenamiento de redes neuronales: modulo1/capitulo2/m1c2l2.md
      - 3. Sesgo y sobreajuste: modulo1/capitulo2/m1c2l3.md
    - Cap 3 | Procesamiento de Lenguaje Natural:
      - 1. Introducción al PLN: modulo1/capitulo2/m1c2l1.md
      - 2. Embeddings: modulo1/capitulo2/m1c2l2.md
      - 3. LLMs: modulo1/capitulo2/m1c2l3.md

  - Modulo 2:
    - Presentación: modulo2/m2-intro.md
  - Modulo 3:
    - Presentación: modulo3/m3-intro.md

plugins:
  - search:
      lang: es
  - git-committers:
      repository: squidfunk/mkdocs-material
      branch: main
      enabled: !ENV [CI, false]


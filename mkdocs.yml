site_name: IA en Educación Superior
site_url: https://sitename.example
repo_url: https://github.com/mjoviedo/test-mkdocs
repo_name: mjoviedo/test-mkdocs
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: overrides
  language: es
  icon:
    logo: fontawesome/solid/hexagon-nodes
    edit: fontawesome/solid/pen-to-square
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
#    - navigation.sections
    - content.action.edit
    
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/brightness-2
        name: Modo oscuro
      primary: pink
      accent: teal

    # Light Mode
    - scheme: default
      toggle:
        icon: material/brightness-6
        name: Modo claro
      primary: teal
      accent: pink
    
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
       custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
      title: 
      toc_depth: 3

nav:
  - Inicio: index.md
  - Presentación:
    - Sobre el curso: empecemos/intro.md
    - Recomendaciones: empecemos/recomendaciones.md
    - Comunidad: empecemos/comunidad.md
    - Contribuir: empecemos/contribuir.md
    - Antecedentes: empecemos/antecedentes.md
    - Créditos: empecemos/creditos.md
  - Módulo 1:
    - Presentación del módulo: modulo1/m1-intro.md
    - Cap 1 | Computación y redes:
      - 1. La computadora moderna: modulo1/capitulo1/m1c1l1.md
      - 2. Información: modulo1/capitulo1/m1c1l2.md
      - 3. Hardware: modulo1/capitulo1/m1c1l3.md
      - 4. Software: modulo1/capitulo1/m1c1l4.md
      - 5. Internet: modulo1/capitulo1/m1c1l5.md
      - 6. Plataformas: modulo1/capitulo1/m1c1l6.md
      - 7. Datos: modulo1/capitulo1/m1c1l7.md

    - Cap 2 | Inteligencia Artificial:
      - 1. Nuevo paradigma de la computación: modulo1/capitulo2/m1c2l1.md
      - 2. Principales enfoques: modulo1/capitulo2/m1c2l2.md
      - 3. Introducción a modelos de ML: modulo1/capitulo2/m1c2l3.md
      - 4. Principales modelos: modulo1/capitulo2/m1c2l4.md
      - 5. La neurona y la red: modulo1/capitulo2/m1c2l5.md
      - 7. Jugando con redes: modulo1/capitulo2/m1c2l6.md
      - 8. Sesgo y sobreajuste: modulo1/capitulo2/m1c2l7.md

    - Cap 3 | IA Generativa:
      - 1. Introducción al PLN: modulo1/capitulo3/m1c3l1.md
      - 2. Embeddings: modulo1/capitulo3/m1c3l2.md
      - 3. Modelos de lenguaje: modulo1/capitulo3/m1c3l3.md

    - Cap 4 | Infraestructura:
      - 1. Stack: modulo1/capitulo4/m1c4l1.md
      - 2. MCPs: modulo1/capitulo4/m1c4l2.md
      - 3. APIs: modulo1/capitulo4/m1c4l3.md

  - Modulo 2:
    - Presentación: modulo2/m2-intro.md
    - Cap 1 | Conocimiento:
      - 1. El concepto de inteligencia y sus críticas: modulo2/capitulo1/m2c1l1.md
      - 2. Estadística y modelos : modulo2/capitulo1/m2c1l2.md
      - 3. Cognición computarizada: modulo2/capitulo1/m2c1l3.md
      - 4. Delegación de funciones: modulo2/capitulo1/m2c1l4.md

    - Cap 2 | Materia:
      - 1. Minerales, hardware y energía: modulo2/capitulo2/m2c2l1.md
      - 2. Software, Datos y Redes: modulo2/capitulo2/m2c2l2.md
      - 3. Almacenamiento, circulación y propiedad: modulo2/capitulo2/m2c2l3.md
      - 4. Costos ambientales: modulo2/capitulo2/m2c2l4.md
      - 5. Ciclo de vida: modulo2/capitulo2/m2c2l5.md

    - Cap 3 | Trabajo:
      - 1. Trabajo y cambio tecnológico: modulo2/capitulo3/m2c3l1.md
      - 2. Automatización: modulo2/capitulo3/m2c3l2.md
      - 3. Trabajo oculto. Fauxtomatización: modulo2/capitulo3/m2c3l3.md
      - 4. Cognitariado: modulo2/capitulo3/m2c3l4.md
      - 5. Diseño de sistemas sociotécnicos: modulo2/capitulo3/m2c3l5.md


    
  - Modulo 3:
    - Presentación: modulo3/m3-intro.md
  - Modulo 4:
    - Presentación: modulo4/m4-intro.md
  

plugins:
  - search:
      lang: es
  - git-committers:
      repository: squidfunk/mkdocs-material
      branch: main
      enabled: !ENV [CI, false]
  - markmap:

